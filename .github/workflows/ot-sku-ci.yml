# This workflow runs manufacturing tests using the ot-sku repository as
# an override. It can either be triggered by the cross-repo CI from ot-sku
# or directly when running the normal opentitan CI.
name: OT SKU CI
on:
  workflow_dispatch:
    inputs:
      # Inputs provided by lowrisc-ci GitHub app
      repository:
        description: OT-SKU repository to check out.
        default: lowRISC/ot-sku
        type: string
      pull_request:
        description: Pull request that triggers this workflow run (optional)
        type: string
      sha:
        description: OT-SKU SHA to report status on
        type: string
      merge_sha:
        description: OT-SKU SHA to run workflow on
        type: string
        default: main
      # Additional inputs
      branch:
        description: Branch name if the workflow is triggered by a push (optional)
        type: string
      run_name:
        description: Name of the triggered workflow run
        type: string
  workflow_call:
    inputs:
      repository:
        description: OT-SKU repository to check out.
        default: lowRISC/ot-sku
        type: string
      merge_sha:
        description: OT-SKU SHA to run workflow on
        type: string
        default: main
      continue-on-error:
        description: Continue workflow in case of errors
        type: boolean
        default: false

# Note that this might run untrusted code from PRs on ot-sku so be careful with
# permissions.
permissions:
  contents: read

run-name: ${{ inputs.run_name }}

# For CI triggered by pull requests, cancel the previous run.
concurrency:
  group: ot-sku-ci-${{ inputs.pull_request || inputs.branch || inputs.merge_sha }}
  cancel-in-progress: true

env:
  VIVADO_VERSION: "2021.1"

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Add summary about the job
        # Only run when called using the cross-ci mechanism.
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ -n "${{ inputs.pull_request }}" ]]; then
            echo "Triggered by [#${{ inputs.pull_request }}](${{ github.server_url }}/${{ inputs.repository }}/pull/${{ inputs.pull_request }})" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ -n "${{ inputs.sha }}" ]]; then
            echo '::notice title=[cross-repo-ci]metadata::{"repository":"${{ inputs.repository }}","sha":"${{ inputs.sha }}"}'
            echo "Triggered on [${{ inputs.sha }}](${{ github.server_url }}/${{ inputs.repository }}/commit/${{ inputs.sha }})" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Running on commit [${{ inputs.merge_sha }}](${{ github.server_url }}/${{ inputs.repository }}/commit/${{ inputs.merge_sha }})" >> $GITHUB_STEP_SUMMARY

  execute_ot_sku_tests:
    name: OT-SKU tests
    needs: start
    runs-on: [ubuntu-22.04-fpga, cw340]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Bitstream cache requires all commits.
          path: opentitan
      - name: Prepare environment
        uses: ./opentitan/.github/actions/prepare-env
        with:
          working-directory: opentitan
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.merge_sha }}
          path: ot-sku
      - name: Build binary signature tests
        id: build-signature-tests
        continue-on-error: ${{ inputs.continue-on-error }}
        run: |
          cd opentitan
          ./bazelisk.sh build \
            --override_module=ot_provisioning_exts=${{ github.workspace }}/ot-sku \
            @provisioning_exts//open/binaries/perso:signature_test \
            @provisioning_exts//open/binaries/rom_ext:signature_test
      - name: Check release binaries verify with current keys
        id: signature-tests
        if: steps.build-signature-tests.outcome == 'success'
        # If the test failed, then `ot-sku` needs a new release (this is not a typical CI failure).
        # Checking this first avoids trying to run more expensive FPGA tests, and makes it clearer
        # why FPGA tests were skipped on `ot-sku` while waiting for a release.
        continue-on-error: true
        run: |
          cd opentitan
          ./bazelisk.sh test \
            --override_module=ot_provisioning_exts=${{ github.workspace }}/ot-sku \
            @provisioning_exts//open/binaries/perso:signature_test \
            @provisioning_exts//open/binaries/rom_ext:signature_test
      # CI will still show passes even if the releases are outdated, so loudly warn about this.
      - name: Warn about out-of-date release binaries
        if: steps.signature-tests.outcome == 'failure'
        run: |
          echo "::warning::The pinned release binaries do not verify with the current keys, meaning a new release is needed. Skipping FPGA tests."
          echo "### Pinned binaries out of date, skipped FPGA tests" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute tests
        if: steps.signature-tests.outcome == 'success'
        continue-on-error: ${{ inputs.continue-on-error }}
        run: |
          cd opentitan
          . util/build_consts.sh
          module load "xilinx/vivado/$VIVADO_VERSION"
          # TODO: make set of tests configurable?
          ./bazelisk.sh test \
            --override_module=ot_provisioning_exts=${{ github.workspace }}/ot-sku \
            --test_tag_filters="cw340,-manual,-broken,-skip_in_ci" \
            --build_tests_only \
            //sw/host/provisioning/orchestrator/tests/...
