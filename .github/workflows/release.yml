name: Create Release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag
        required: true
        type: string
      ref:
        description: Git branch or commit hash to checkout
        required: true
        type: string
        default: master
      target:
        description: Bazel target to add to the release
        required: true
        type: string
        default: //release/devbundle:devbundle

jobs:
  release:
    permissions:
      # Necessary permission to create a release:
      contents: write
    runs-on: ubuntu-22.04-vivado
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required by bitstream cache script
          ref: ${{ inputs.ref }}

      - name: Prepare Nix
        # Only `master` uses Nix, releases from other branches do not use it.
        if: hashFiles('.github/actions/prepare-nix/action.yml') != ''
        uses: ./.github/actions/prepare-nix

      # This is a somewhat horrible hack to make this workflow usable on both `master`
      # and on older branches (e.g. `earlgrey_1.0.0`). Essentially, if this branch uses
      # Nix, then make sure its Verilator is visible on PATH. If it does not, then it
      # is assumed it (i.e. the older Verilator version) should already be on PATH.
      - name: Put Nix's Verilator on PATH
        if: hashFiles('.github/actions/prepare-nix/action.yml') != ''
        run: |
          verilator="$(nix run --quiet --no-warn-dirty .#eda -- \
            sh -c 'readlink -f "$(command -v verilator)"' | tail -n1)"
          if [[ ! -x "$verilator" ]]; then
            echo "::error::Could not find Verilator from Nix"
            exit 1
          fi
          echo "$(dirname "$verilator")" >> "$GITHUB_PATH"

      - name: Prepare environment
        uses: ./.github/actions/prepare-env
        with:
          service_account_json: '${{ secrets.BAZEL_CACHE_CREDS }}'

      - name: Check target
        run: |
          output_file="$(./bazelisk.sh cquery --output=files ${{ inputs.target }} )"

          num_files="$(echo "$output_file" | wc -l)"
          if [[ "$num_files" -ne 1 ]]; then
            echo "::error::Expected one file, got ${num_files}"
            exit 1
          fi

          if [[ "$output_file" != *.tar* ]]; then
            echo "::error::Expected tarball, got '${output_file}'"
            exit 1
          fi

          echo "output_file=${output_file}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          module load xilinx/vivado
          ./bazelisk.sh build '${{ inputs.target }}'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the release if it doesn't already exist
          gh release create '${{ inputs.release_tag }}' \
            --prerelease                                \
            --target '${{ inputs.ref }}'                \
            --title "${{ inputs.release_tag }}"         \
            --notes ""                                  \
          || echo "release exists"

          # Add the artifacts
          gh release upload '${{ inputs.release_tag }}' \
            --clobber \
            "$output_file"
