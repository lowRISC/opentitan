name: FPGA bitstream build
on:
  workflow_call:
    inputs:
      top_name:
        type: string
      design_suffix:
        type: string
      use_gh_cache:
        type: boolean
        default: true
      vivado_version:
        default: "2021.1"
        type: string

jobs:
  bitstream:
    name: Build bitstream
    runs-on: ubuntu-22.04-bitstream
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Required by get-bitstream-strategy.sh
      - name: Prepare environment
        uses: ./.github/actions/prepare-env
        with:
          service_account_json: '${{ secrets.BAZEL_CACHE_CREDS }}'

      - name: Find reusable bitstream in GCS cache
        id: strategy
        run: |
          ci/scripts/get-bitstream-strategy.sh "chip_${{ inputs.top_name }}_${{ inputs.design_suffix }}" \
            ':!/third_party/rust/' \
            ':!/sw/' \
            ':!/*.hjson' \
            ':!/*.tpl' \
            ':!/site/' \
            ':!/doc/' \
            ':!/COMMITTERS' \
            ':!/CLA' \
            ':!/*.md' \
            ':!/.github/' \
            ':!/hw/**/dv/*' \
            ':!/hw/**/generic_dv/*' \
            ':!/hw/dv/'

      - name: Extract cached bitstream from GCS cache
        if: steps.strategy.outputs.bitstreamStrategy == 'cached'
        run: |
          . util/build_consts.sh
          bazel_package="//hw/bitstream"
          design_name=chip_${{ inputs.top_name }}_${{ inputs.design_suffix }}
          cached_archive="${bazel_package}:${design_name}_cached_archive"
          ./bazelisk.sh build "${cached_archive}"
          bitstream_archive=$(./bazelisk.sh outquery "${cached_archive}")
          cp -Lv ${bitstream_archive} build-bin.tar

      # If we cannot find a usable bitstream in the GCS cache, we look into the GitHub cache.
      # This cache is only used to skip bitstream rebuilds when pushing a "trivial" update to a PR.
      # "Trivial" here means that the PR update doesn't touch the bitstream sources.

      # Build the key that identifies the cache entry.
      - name: Compute the GitHub cache key
        id: gh-cache-key
        if: steps.strategy.outputs.bitstreamStrategy != 'cached'
        run: |
          hash_gen_command="//hw/bitstream/vivado:fpga_${{ inputs.design_suffix }}_hash"
          module load "xilinx/vivado/${{ inputs.vivado_version }}"
          ./bazelisk.sh build "${hash_gen_command}"
          hash_file=$(./bazelisk.sh cquery "${hash_gen_command}")
          hash=$(cat "${hash_file}")
          echo "GitHub cache key is \"${hash}\""
          echo "ghCacheKey=${hash}" >> $GITHUB_OUTPUT

      # Try to retrieve build-bin.tar from the GitHub cache.
      - name: Extract cached bitstream from GitHub cache
        id: gh-cache
        if: inputs.use_gh_cache && steps.strategy.outputs.bitstreamStrategy != 'cached'
        uses: actions/cache@v6
        with:
          path: build-bin.tar
          key: ${{ steps.gh-cache-key.outputs.ghCacheKey }}

      - name: Build base bitstream with Vivado
        if: >
          steps.strategy.outputs.bitstreamStrategy != 'cached' &&
          steps.gh-cache.outputs.cache-hit != 'true'
        run: |
          bazel_package=//hw/bitstream/vivado
          bitstream_target=${bazel_package}:fpga_${{ inputs.design_suffix }}
          archive_target=${bazel_package}:${{ inputs.top_name }}_${{ inputs.design_suffix }}_archive
          trap 'get_logs' EXIT
          get_logs() {
            design_name=chip_${{ inputs.top_name }}_${{ inputs.design_suffix }}
            SUB_PATH="hw/top_${{ inputs.top_name }}/${design_name}"
            mkdir -p "$OBJ_DIR/$SUB_PATH" "$BIN_DIR/$SUB_PATH"
            # This can fail if the build result is from Bazel cache
            cp -rLvt "$OBJ_DIR/$SUB_PATH/" \
              $(./bazelisk.sh outquery-all ${bitstream_target}) || true
            bitstream_archive=$(./bazelisk.sh outquery ${archive_target})
            cp -Lv ${bitstream_archive} build-bin.tar
          }

          . util/build_consts.sh
          module load "xilinx/vivado/${{ inputs.vivado_version }}"
          ./bazelisk.sh build ${archive_target}

      - name: Display synthesis & implementation logs
        if: >
          steps.strategy.outputs.bitstreamStrategy != 'cached' &&
          steps.gh-cache.outputs.cache-hit != 'true'
        run: |
          . util/build_consts.sh

          vlnv_path=lowrisc_systems_chip_${{ inputs.top_name }}_${{ inputs.design_suffix }}_0.1
          design_name=chip_${{ inputs.top_name }}_${{ inputs.design_suffix }}

          echo "Synthesis log"
          cat $OBJ_DIR/hw/top_${{ inputs.top_name }}/${design_name}/${vlnv_path}.runs/synth_1/runme.log || true

          echo "Implementation log"
          cat $OBJ_DIR/hw/top_${{ inputs.top_name }}/${design_name}/${vlnv_path}.runs/impl_1/runme.log || true

          echo "Utilization report"
          cat $OBJ_DIR/hw/top_${{ inputs.top_name }}/${design_name}/${vlnv_path}.runs/impl_1/${design_name}_utilization_placed.rpt || true

          echo "Timing summary report"
          cat $OBJ_DIR/hw/top_${{ inputs.top_name }}/${design_name}/${vlnv_path}.runs/impl_1/${design_name}_timing_summary_routed.rpt || true

      - name: Upload step outputs
        uses: actions/upload-artifact@v7
        with:
          name: partial-build-bin-chip_${{ inputs.top_name }}_${{ inputs.design_suffix }}
          path: build-bin.tar

      - name: Upload artifacts if build failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chip_${{ inputs.top_name }}_${{ inputs.design_suffix }}-build-out
          path: build-out
