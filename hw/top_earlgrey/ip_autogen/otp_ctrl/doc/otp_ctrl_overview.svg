<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 800 440" width="800" height="440">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <style>
      text { font-family: "Inconsolata", "DejaVu Sans Mono", "Courier New", monospace; font-size: 13px; fill: #000000; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
      .ip { font-weight: bold; }
      .or { font-size: 14px; font-weight: bold; fill: #666666; }
      .top { fill: #d9d9d9; stroke: #000000; stroke-width: 1; }
      .blk { fill: #c9daf8; stroke: #000000; stroke-width: 1; }
      .be { fill: #fff2cc; stroke: #000000; stroke-width: 1; }
      .shim { fill: #ffd966; stroke: #000000; stroke-width: 1; }
      .vend { fill: #f4cccc; stroke: #000000; stroke-width: 1; }
      .mem { fill: #cccccc; stroke: #000000; stroke-width: 1; }
      .sub { fill: #ffffff; stroke: #000000; stroke-width: 1; }
      .w { stroke: #000000; stroke-width: 1; fill: none; }
      .d { stroke: #999999; stroke-width: 1; stroke-dasharray: 5 4; fill: none; }
      .bus { fill: #ffffff; stroke: #000000; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="440" fill="#ffffff"/>

  <!-- ===================================================== otp_ctrl -->
  <rect class="top" x="120" y="20" width="350" height="345"/>
  <text class="ip" x="200" y="45">otp_ctrl (open-source)</text>

  <rect class="blk" x="140" y="40" width="34" height="290"/>
  <text class="c" transform="translate(162,185) rotate(-90)">Register Interface</text>

  <!-- left side IOs -->
  <line class="w" x1="140" y1="110" x2="95" y2="110" marker-end="url(#ah)"/>
  <text class="e" x="90" y="106">IRQs &amp;</text>
  <text class="e" x="90" y="121">Alerts</text>
  <polygon class="bus" points="95,240 107,228 107,234 128,234 128,228 140,240 128,252 128,246 107,246 107,252"/>
  <text class="e" x="90" y="230">TL-UL</text>
  <text class="e" x="90" y="245">Bus IF</text>
  <text class="e" x="90" y="260">tl_i / tl_o</text>

  <!-- internal blocks -->
  <rect class="blk" x="200" y="60" width="190" height="55"/>
  <text class="c" x="295" y="84">Access Ctrl</text>
  <text class="c" x="295" y="101">(Lockable Regions)</text>
  <rect class="blk" x="200" y="140" width="190" height="34"/>
  <text class="c" x="295" y="162">Scramble / Digest</text>
  <rect class="blk" x="200" y="198" width="190" height="34"/>
  <text class="c" x="295" y="220">Readout Ctrl</text>
  <rect class="blk" x="200" y="262" width="190" height="34"/>
  <text class="c" x="295" y="284">Logical Partitions</text>

  <line class="w" x1="174" y1="88" x2="200" y2="88" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line class="w" x1="200" y1="279" x2="174" y2="279" marker-end="url(#ah)"/>
  <line class="w" x1="295" y1="115" x2="295" y2="140" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line class="w" x1="295" y1="174" x2="295" y2="198" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line class="w" x1="295" y1="232" x2="295" y2="262" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- bottom outputs -->
  <line class="w" x1="225" y1="296" x2="225" y2="390" marker-end="url(#ah)"/>
  <text class="c" x="205" y="407">Hardware</text>
  <text class="c" x="205" y="423">Broadcast</text>
  <line class="w" x1="295" y1="296" x2="295" y2="390" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="c" x="300" y="407">Life-Cycle</text>
  <text class="c" x="300" y="423">Interface</text>
  <line class="w" x1="370" y1="296" x2="370" y2="390" marker-end="url(#ah)"/>
  <text class="c" x="395" y="407">Scrambling</text>
  <text class="c" x="395" y="423">Keys</text>

  <!-- macro interface -->
  <line class="w" x1="390" y1="88" x2="430" y2="88"/>
  <line class="w" x1="430" y1="215" x2="390" y2="215" marker-end="url(#ah)"/>
  <line class="w" x1="430" y1="88" x2="430" y2="215"/>
  <line class="w" x1="430" y1="150" x2="505" y2="150" marker-start="url(#ah)"/>
  <text x="436" y="170" style="font-size:11px">macro IF</text>
  <circle cx="505" cy="150" r="3" fill="#000000"/>
  <polyline class="w" points="505,150 505,95 540,95" marker-end="url(#ah)"/>
  <polyline class="w" points="505,150 505,285 540,285" marker-end="url(#ah)"/>

  <!-- ===================================================== backend option 1 -->
  <rect class="be" x="540" y="20" width="240" height="155"/>
  <text class="ip" x="550" y="165">otp_macro</text>
  <rect class="shim" x="555" y="40" width="90" height="105"/>
  <text class="c" x="600" y="88">Interface</text>
  <text class="c" x="600" y="104">Adapter</text>
  <rect class="vend" x="670" y="40" width="95" height="105"/>
  <text class="c" x="717" y="88">OTP Macro</text>
  <text class="c" x="717" y="104">(Vendor IP)</text>
  <line class="w" x1="645" y1="92" x2="670" y2="92" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line class="w" x1="717" y1="5" x2="717" y2="40" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="e" x="710" y="14">test / power seq.</text>

  <!-- separator -->
  <line class="d" x1="520" y1="195" x2="790" y2="195"/>
  <text class="or" x="480" y="200">or</text>

  <!-- ===================================================== backend option 2 -->
  <rect class="be" x="540" y="215" width="150" height="150"/>
  <text class="ip" x="550" y="355">rram_ctrl</text>
  <rect class="shim" x="555" y="245" width="120" height="80"/>
  <text class="c" x="615" y="290">rram_ctrl_otp</text>
  <rect class="be" x="696" y="215" width="98" height="150"/>
  <text class="ip" x="703" y="355">rram_macro</text>
  <rect class="mem" x="712" y="245" width="66" height="80"/>
  <text class="c" x="745" y="282">OTP</text>
  <text class="c" x="745" y="298">Region</text>
  <line class="w" x1="675" y1="285" x2="712" y2="285" marker-start="url(#ah)" marker-end="url(#ah)"/>
</svg>
