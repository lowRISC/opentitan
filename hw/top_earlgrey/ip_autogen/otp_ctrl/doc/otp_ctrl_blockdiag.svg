<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="-30 0 1040 740" width="1040" height="740">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff0000"/>
    </marker>
    <style>
      text { font-family: "Inconsolata", "DejaVu Sans Mono", "Courier New", monospace; font-size: 12px; fill: #000000; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
      .ip { font-size: 13px; font-weight: bold; }
      .small { font-size: 10.5px; }
      .red { fill: #ff0000; }
      .top { fill: #f3f3f3; stroke: #000000; stroke-width: 1; }
      .blk { fill: #c9daf8; stroke: #000000; stroke-width: 1; }
      .sw { fill: #d9ead3; stroke: #000000; stroke-width: 1; }
      .hw { fill: #93c47d; stroke: #000000; stroke-width: 1; }
      .gray { fill: #cccccc; stroke: #000000; stroke-width: 1; }
      .w { stroke: #000000; stroke-width: 1; fill: none; }
      .wt { stroke: #000000; stroke-width: 3; fill: none; }
      .wr { stroke: #ff0000; stroke-width: 1; fill: none; }
      .bus { fill: #ffffff; stroke: #000000; stroke-width: 1; }
    </style>
  </defs>

  <rect x="-30" y="0" width="1040" height="740" fill="#ffffff"/>

  <!-- ===================================================== otp_ctrl -->
  <rect class="top" x="110" y="35" width="750" height="570"/>
  <text class="ip" x="120" y="595">otp_ctrl</text>

  <!-- register interface -->
  <rect class="blk" x="130" y="55" width="40" height="520"/>
  <text class="c" transform="translate(155,315) rotate(-90)">Register Interface</text>
  <line class="w" x1="130" y1="230" x2="80" y2="230" marker-end="url(#ah)"/>
  <text class="e" x="75" y="226">IRQs &amp;</text>
  <text class="e" x="75" y="241">Alerts</text>
  <polygon class="bus" points="80,400 92,388 92,394 118,394 118,388 130,400 118,412 118,406 92,406 92,412"/>
  <text class="e" x="75" y="390">TL-UL</text>
  <text class="e" x="75" y="405">Bus IF</text>
  <text class="e" x="75" y="420">core_tl_i/o</text>

  <!-- DAI -->
  <rect class="blk" x="260" y="60" width="210" height="50"/>
  <text class="c" x="365" y="81">Direct Access Interface</text>
  <text class="c" x="365" y="97">(DAI)</text>
  <line class="w" x1="170" y1="85" x2="260" y2="85" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="c" x="215" y="78">CSRs (RW)</text>
  <line class="w" x1="365" y1="8" x2="365" y2="60" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="372" y="20">pwr_otp_i/o</text>

  <!-- access locks -->
  <g class="wr">
    <line x1="290" y1="160" x2="290" y2="110" marker-end="url(#ahr)"/>
    <line x1="310" y1="160" x2="310" y2="110" marker-end="url(#ahr)"/>
    <line x1="330" y1="160" x2="330" y2="110" marker-end="url(#ahr)"/>
    <line x1="350" y1="160" x2="350" y2="110" marker-end="url(#ahr)"/>
  </g>
  <text class="red" x="362" y="140">Access Locks</text>

  <!-- partitions (stacked to indicate several partitions per group) -->
  <rect class="sw" x="268" y="152" width="210" height="62"/>
  <rect class="sw" x="264" y="156" width="210" height="62"/>
  <rect class="sw" x="260" y="160" width="210" height="62"/>
  <text x="268" y="182">Unbuffered Partitions</text>
  <text class="small" x="268" y="198">(e.g. VENDOR_TEST, *_SW_CFG)</text>
  <text class="small" x="268" y="212">(Window, opt. Scrambled)</text>
  <line class="w" x1="260" y1="191" x2="170" y2="191" marker-end="url(#ah)"/>
  <text class="c" x="215" y="184">Window (RO)</text>

  <rect class="hw" x="268" y="252" width="210" height="62"/>
  <rect class="hw" x="264" y="256" width="210" height="62"/>
  <rect class="hw" x="260" y="260" width="210" height="62"/>
  <text x="268" y="282">Buffered Partitions</text>
  <text class="small" x="268" y="298">(e.g. HW_CFG*)</text>
  <text class="small" x="268" y="312">(Buffered, ECC, Digest)</text>
  <line class="w" x1="260" y1="291" x2="170" y2="291" marker-end="url(#ah)"/>
  <text class="c" x="215" y="284">Digest (RO)</text>

  <rect class="hw" x="268" y="352" width="210" height="62"/>
  <rect class="hw" x="264" y="356" width="210" height="62"/>
  <rect class="hw" x="260" y="360" width="210" height="62"/>
  <text x="268" y="382">Secret Partitions</text>
  <text class="small" x="268" y="398">(e.g. SECRET*)</text>
  <text class="small" x="268" y="412">(Buf, ECC, Digest, Scrambled)</text>
  <line class="w" x1="260" y1="391" x2="170" y2="391" marker-end="url(#ah)"/>
  <text class="c" x="215" y="384">Digest (RO)</text>

  <rect class="hw" x="260" y="452" width="210" height="62"/>
  <text x="268" y="478">LIFE_CYCLE Partition</text>
  <text class="small" x="268" y="496">(Buffered, ECC)</text>

  <!-- partition and DAI connections to the arbiters -->
  <line class="wt" x1="530" y1="85" x2="530" y2="500"/>
  <line class="w" x1="470" y1="85" x2="530" y2="85"/>
  <text x="478" y="78">RW</text>
  <line class="w" x1="478" y1="183" x2="530" y2="183"/>
  <text x="484" y="176">RO</text>
  <line class="w" x1="478" y1="283" x2="530" y2="283"/>
  <text x="484" y="276">RO</text>
  <line class="w" x1="478" y1="383" x2="530" y2="383"/>
  <text x="484" y="376">RO</text>
  <line class="w" x1="470" y1="483" x2="530" y2="483"/>
  <text x="484" y="476">RO</text>

  <!-- macro interface arbiter -->
  <polygon class="blk" points="560,60 590,75 590,155 560,170"/>
  <text class="c" transform="translate(579,115) rotate(90)">RR Arbiter</text>
  <line class="w" x1="530" y1="115" x2="560" y2="115" marker-end="url(#ah)"/>
  <line class="w" x1="590" y1="115" x2="860" y2="115"/>
  <line class="w" x1="860" y1="115" x2="900" y2="115" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="625" y="105">Macro Interface</text>
  <text x="866" y="105">otp_macro_o/i</text>
  <text x="866" y="135" class="small">(to otp_macro</text>
  <text x="866" y="148" class="small">or rram_ctrl)</text>

  <!-- scrambling datapath arbiter -->
  <polygon class="blk" points="560,245 590,260 590,340 560,355"/>
  <text class="c" transform="translate(579,300) rotate(90)">RR Arbiter</text>
  <line class="w" x1="530" y1="300" x2="560" y2="300" marker-end="url(#ah)"/>
  <line class="w" x1="590" y1="300" x2="620" y2="300" marker-start="url(#ah)" marker-end="url(#ah)"/>

  <!-- scrambling datapath -->
  <rect class="blk" x="620" y="190" width="225" height="210"/>
  <text class="c" x="732" y="210">Scrambling Datapath</text>
  <rect class="gray" x="640" y="222" width="185" height="45"/>
  <text class="c" x="732" y="249">Scrambling Control</text>
  <rect class="gray" x="640" y="278" width="185" height="45"/>
  <text class="c" x="732" y="305">PRESENT Encrypt</text>
  <rect class="gray" x="640" y="334" width="185" height="45"/>
  <text class="c" x="732" y="361">PRESENT Decrypt</text>

  <!-- LFSR timer -->
  <rect class="blk" x="620" y="420" width="225" height="46"/>
  <text class="c" x="732" y="439">LFSR Timer, Alert &amp; Error Ctrl</text>
  <text class="c small" x="732" y="455">(check intervals)</text>
  <line class="w" x1="900" y1="443" x2="845" y2="443" marker-end="url(#ah)"/>
  <text x="866" y="436">lc_escalate_en_i</text>

  <!-- LCI and KDI -->
  <rect class="blk" x="620" y="490" width="105" height="70"/>
  <text class="c" x="672" y="518">Life Cycle</text>
  <text class="c" x="672" y="533">Interface</text>
  <text class="c" x="672" y="548">(LCI)</text>
  <polyline class="w" points="620,525 530,525 530,500"/>
  <text x="560" y="518">WO</text>
  <rect class="blk" x="740" y="490" width="105" height="70"/>
  <text class="c" x="792" y="510">Key</text>
  <text class="c" x="792" y="525">Derivation</text>
  <text class="c" x="792" y="540">Interface</text>
  <text class="c" x="792" y="555">(KDI)</text>
  <line class="w" x1="792" y1="490" x2="792" y2="466" marker-end="url(#ah)"/>
  <line class="w" x1="672" y1="490" x2="672" y2="466" marker-end="url(#ah)"/>

  <!-- bottom outputs -->
  <line class="w" x1="290" y1="514" x2="290" y2="640" marker-end="url(#ah)"/>
  <line class="w" x1="305" y1="514" x2="305" y2="640" marker-end="url(#ah)"/>
  <line class="w" x1="320" y1="514" x2="320" y2="640" marker-end="url(#ah)"/>
  <text class="e" x="282" y="655">otp_broadcast_o</text>
  <text class="e" x="282" y="669">otp_lc_data_o</text>
  <text class="e" x="282" y="683">keymgr_*_o</text>

  <!-- life cycle qualifier inputs -->
  <g class="w">
    <line x1="430" y1="640" x2="430" y2="514" marker-end="url(#ah)"/>
    <line x1="440" y1="640" x2="440" y2="514" marker-end="url(#ah)"/>
    <line x1="450" y1="640" x2="450" y2="514" marker-end="url(#ah)"/>
    <line x1="460" y1="640" x2="460" y2="514" marker-end="url(#ah)"/>
    <line x1="470" y1="640" x2="470" y2="514" marker-end="url(#ah)"/>
  </g>
  <text x="478" y="655">lc_creator_seed_sw_rw_en_i</text>
  <text x="478" y="669">lc_owner_seed_sw_rw_en_i</text>
  <text x="478" y="683">lc_seed_hw_rd_en_i</text>
  <text x="478" y="697">lc_rma_state_i</text>
  <text x="478" y="711">lc_check_byp_en_i</text>

  <line class="w" x1="680" y1="675" x2="680" y2="560" marker-end="url(#ah)"/>
  <line class="w" x1="705" y1="560" x2="705" y2="675" marker-end="url(#ah)"/>
  <text class="c" x="700" y="690">LC Trans.</text>
  <text class="c" x="700" y="705">(Req/Ack)</text>
  <line class="w" x1="770" y1="560" x2="770" y2="640" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="c" x="770" y="655">Scr. Keys</text>
  <text class="c" x="770" y="670">(Req/Ack)</text>
  <line class="w" x1="830" y1="560" x2="830" y2="640" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="c" x="840" y="655">EDN</text>
  <text class="c" x="840" y="670">(Req/Ack)</text>
</svg>
