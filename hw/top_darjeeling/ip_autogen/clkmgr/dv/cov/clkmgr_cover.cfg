// The TL-UL exclusions of common_cov_excl.cfg that name the instance tb.dut, for the primary
// partition, which has the TL-UL ports.
// [UNSUPPORTED] Based on our Comportable IP spec, these TL pins are reserved / unused and hence,
// tied off.
-node tb.dut_primary *tl_i.a_user.rsvd
-node tb.dut_primary *tl_i.a_param
// [UNR] design ties these outputs to zeros.
-node tb.dut_primary *tl_o.d_param
-node tb.dut_primary *tl_o.d_opcode[1]
-node tb.dut_primary *tl_o.d_opcode[2]
-node tb.dut_primary *tl_o.d_sink
// [UNR] due to the ECC logics
-node tb.dut_primary *tl_o.d_user.rsp_intg[6]

// The DUT is the two partitions. The shared cover.cfg selects the instance tb.dut, which this
// testbench does not have, so select the partitions here, by module, as cover_reg_top.cfg selects
// the register file. Toggle and assertion coverage keep the shared policy: toggle covers the top
// level of each partition (as +tree tb.dut 1 does) and the modules that cover.cfg lists.
// VCS requires these metric-specific entries after all the other entries of the file.
begin line+cond+fsm+branch
  +moduletree clkmgr_part_primary
  +moduletree clkmgr_part_secondary
end
begin tgl
  +module clkmgr_part_primary
  +module clkmgr_part_secondary
end
