<text x="428" y="20.68" font-size="13" font-family="monospace" font-weight="bold" fill="#5b8f43">cheriot_mem_sys_fpv_checker</text>
<text x="340" y="62.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">TL-UL ports</text>
<text x="340" y="147.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">ports between blocks,</text>
<text x="340" y="162.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">alert request</text>
<text x="340" y="237.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">requester ports,</text>
<text x="340" y="252.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">meta_sram_tl</text>
<text x="340" y="322.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">ports inside the</text>
<text x="340" y="337.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">engine, interrupt</text>
<text x="340" y="407.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">regs_tl_d,</text>
<text x="340" y="422.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">reg2hw, hw2reg</text>
<text x="340" y="487.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">fault inputs,</text>
<text x="340" y="502.7" font-size="12" font-family="monospace" fill="#7a7a7a" text-anchor="middle">alert pairs</text>
<text x="410" y="594.2" font-size="12" font-family="monospace" fill="#2b2b2b" text-anchor="middle">bind cheriot_mem_sys cheriot_mem_sys_fpv_checker (.*, ports between blocks,</text>
<text x="410" y="612.2" font-size="12" font-family="monospace" fill="#2b2b2b" text-anchor="middle">reg2hw, hw2reg, fault inputs of the alert logic)</text>
