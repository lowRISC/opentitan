<text x="130" y="61.15" font-size="14" font-weight="bold" text-anchor="middle">Ports of the subsystem</text>
<text x="130" y="75.72" font-size="11" fill="#5c5c5c" text-anchor="middle">seven TL-UL ports, tag sideband,</text>
<text x="130" y="89.47" font-size="11" fill="#5c5c5c" text-anchor="middle">alert, interrupt</text>
<rect x="20" y="130" width="220" height="80" rx="4" fill="#eaf1fb" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="130" y="161.15" font-size="14" font-weight="bold" text-anchor="middle">Tag path</text>
<text x="130" y="175.72" font-size="11" fill="#5c5c5c" text-anchor="middle">core's tag filter with the WTRC,</text>
<text x="130" y="189.47" font-size="11" fill="#5c5c5c" text-anchor="middle">2:1 tag arbiter, RMW filter</text>
<rect x="20" y="230" width="220" height="60" rx="4" fill="#eaf1fb" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="130" y="251.15" font-size="14" font-weight="bold" text-anchor="middle">Access path</text>
<text x="130" y="265.73" font-size="11" fill="#5c5c5c" text-anchor="middle">four access checkers,</text>
<text x="130" y="279.48" font-size="11" fill="#5c5c5c" text-anchor="middle">4:1 arbiter</text>
<rect x="20" y="310" width="220" height="70" rx="4" fill="#eaf1fb" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="130" y="336.15" font-size="14" font-weight="bold" text-anchor="middle">Revocation engine</text>
<text x="130" y="350.73" font-size="11" fill="#5c5c5c" text-anchor="middle">filters, sweep control,</text>
<text x="130" y="364.48" font-size="11" fill="#5c5c5c" text-anchor="middle">core write watch</text>
<rect x="20" y="400" width="220" height="60" rx="4" fill="#eaf1fb" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="130" y="434.9" font-size="14" text-anchor="middle">Register file</text>
<rect x="20" y="480" width="220" height="60" rx="4" fill="#eaf1fb" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="130" y="508.02" font-size="14" font-weight="bold" text-anchor="middle">Alert logic</text>
<text x="130" y="522.6" font-size="11" fill="#5c5c5c" text-anchor="middle">alert sender</text>
<rect x="440" y="40" width="360" height="60" rx="4" fill="#eef7ea" stroke="#82b366" stroke-width="1.2"/>
<text x="620" y="61.15" font-size="14" font-weight="bold" text-anchor="middle">TL-UL ABVIP</text>
<text x="620" y="75.72" font-size="11" fill="#5c5c5c" text-anchor="middle">one instance per TL-UL port: plays the</text>
<text x="620" y="89.47" font-size="11" fill="#5c5c5c" text-anchor="middle">host, plays the device or checks both ends</text>
<rect x="440" y="130" width="360" height="80" rx="4" fill="#eef7ea" stroke="#82b366" stroke-width="1.2"/>
<text x="620" y="161.15" font-size="14" font-weight="bold" text-anchor="middle">Tag path checker</text>
<text x="620" y="175.72" font-size="11" fill="#5c5c5c" text-anchor="middle">tag filter, WTRC, 2:1 tag arbiter,</text>
<text x="620" y="189.47" font-size="11" fill="#5c5c5c" text-anchor="middle">RMW filter, alert on a tag path fault</text>
<rect x="440" y="230" width="360" height="60" rx="4" fill="#eef7ea" stroke="#82b366" stroke-width="1.2"/>
<text x="620" y="251.15" font-size="14" font-weight="bold" text-anchor="middle">Meta access checker</text>
<text x="620" y="265.73" font-size="11" fill="#5c5c5c" text-anchor="middle">access checkers, 4:1 arbiter,</text>
<text x="620" y="279.48" font-size="11" fill="#5c5c5c" text-anchor="middle">protection of the tag store</text>
<rect x="440" y="310" width="360" height="70" rx="4" fill="#eef7ea" stroke="#82b366" stroke-width="1.2"/>
<text x="620" y="336.15" font-size="14" font-weight="bold" text-anchor="middle">Revocation engine checker</text>
<text x="620" y="350.73" font-size="11" fill="#5c5c5c" text-anchor="middle">sweep, decision and clears, core write</text>
<text x="620" y="364.48" font-size="11" fill="#5c5c5c" text-anchor="middle">watch, errors, alert on an engine fault</text>
<rect x="440" y="400" width="360" height="60" rx="4" fill="#eef7ea" stroke="#82b366" stroke-width="1.2"/>
<text x="620" y="421.15" font-size="14" font-weight="bold" text-anchor="middle">CSR checker</text>
<text x="620" y="435.73" font-size="11" fill="#5c5c5c" text-anchor="middle">every register field: reset value,</text>
<text x="620" y="449.48" font-size="11" fill="#5c5c5c" text-anchor="middle">access type, lock, error answers</text>
<rect x="440" y="480" width="360" height="60" rx="4" fill="#eef7ea" stroke="#82b366" stroke-width="1.2"/>
<text x="620" y="501.15" font-size="14" font-weight="bold" text-anchor="middle">Register interface and alert checker</text>
<text x="620" y="515.73" font-size="11" fill="#5c5c5c" text-anchor="middle">what the engine receives, broken integrity,</text>
<text x="620" y="529.48" font-size="11" fill="#5c5c5c" text-anchor="middle">the fatal alert on alert_tx_o</text>
