<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1060" height="930"
     viewBox="0 0 1060 930" font-family="Helvetica, Arial, sans-serif" font-size="12.5"
     fill="#1f1f1f">
  <title>CHERIoT memory subsystem block diagram</title>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0127a"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/>
    </marker>
    <style>
      .ip    { fill: #ffffff; stroke: #2b2b2b; stroke-width: 1.5; }
      .lock  { fill: #f2f9ef; stroke: #82b366; stroke-width: 1.2; }
      .blk   { fill: #ffffff; stroke: #2b2b2b; stroke-width: 1.2; }
      .tbre  { fill: #f5f2fc; stroke: #7e6bb5; stroke-width: 1.2; }
      .wtrc  { fill: #fff6e0; stroke: #c99a2e; stroke-width: 1.2; }
      .grp   { fill: none; stroke: #9a9a9a; stroke-width: 1; stroke-dasharray: 4 3; }
      .mem   { fill: #f4f6f8; stroke: #2b2b2b; stroke-width: 1.2; }
      .port  { fill: #ffffff; stroke: #2b2b2b; stroke-width: 1.2; }
      .w     { fill: none; stroke: #2b2b2b; stroke-width: 1.4; marker-end: url(#ak); }
      .wm    { fill: none; stroke: #b0127a; stroke-width: 1.6; marker-end: url(#am); }
      .wc    { fill: none; stroke: #7a7a7a; stroke-width: 1.2; stroke-dasharray: 4 3;
               marker-end: url(#ag); }
      .t     { text-anchor: middle; }
      .b     { font-weight: bold; }
      .s     { font-size: 9.5px; fill: #5c5c5c; }
      .sm    { font-size: 9.5px; fill: #b0127a; }
      .mono  { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 10.5px; }
      .lk    { font-size: 11px; font-style: italic; fill: #5b8f43; }
      .tt    { font-size: 12px; font-weight: bold; fill: #5a4a96; }
    </style>
  </defs>

  <rect x="0" y="0" width="1060" height="930" fill="#ffffff"/>

  <!-- ================================================================ -->
  <!-- rv_core_ibex                                                     -->
  <!-- ================================================================ -->
  <rect class="ip" x="20" y="20" width="460" height="200" rx="6"/>
  <rect class="lock" x="32" y="32" width="436" height="162" rx="5"/>
  <text class="lk" x="458" y="186" text-anchor="end">Lockstep</text>
  <text class="mono b" x="470" y="212" text-anchor="end">rv_core_ibex</text>

  <rect class="blk" x="44" y="50" width="206" height="44" rx="4"/>
  <text class="t b" x="147" y="70">Ibex Core</text>
  <text class="t s" x="147" y="85">CHERIoT-capable</text>

  <rect class="blk" x="155" y="120" width="110" height="40" rx="4"/>
  <text class="t b" x="210" y="137">TRVK Filter</text>
  <text class="t s" x="210" y="151">load barrier</text>

  <!-- ================================================================ -->
  <!-- cheriot_mem_sys                                                  -->
  <!-- ================================================================ -->
  <rect class="ip" x="110" y="270" width="900" height="440" rx="6"/>
  <rect class="lock" x="122" y="282" width="876" height="400" rx="5"/>
  <text class="lk" x="132" y="674">Lockstep</text>
  <text class="mono b" x="963" y="701" text-anchor="end">cheriot_mem_sys</text>

  <!-- Core tag filter with the WTRC on its host port -->
  <rect class="blk" x="135" y="305" width="150" height="131" rx="4"/>
  <text class="t b" x="210" y="325">Tag Filter</text>
  <text class="t s" x="210" y="340">fork &#183; lookup &#183; join</text>
  <rect class="wtrc" x="147" y="362" width="126" height="48" rx="4"/>
  <text class="t b" x="210" y="381">WTRC</text>
  <text class="t s" x="210" y="396">NVM capability stores</text>

  <!-- Background revocation engine -->
  <rect class="tbre" x="345" y="365" width="270" height="233" rx="6"/>
  <text class="tt" x="357" y="385">Revocation Engine (TBRE)</text>

  <rect class="blk" x="360" y="396" width="240" height="38" rx="4"/>
  <text class="t b" x="480" y="412">Mover</text>
  <text class="t s" x="480" y="426">sweep &#183; watch &#183; clear</text>

  <rect class="blk" x="490" y="455" width="110" height="36" rx="4"/>
  <text class="t b" x="545" y="477">TRVK Filter</text>

  <path class="blk" d="M380,512 H564 L544,528 H400 Z"/>

  <rect class="blk" x="397" y="545" width="150" height="38" rx="4"/>
  <text class="t b" x="472" y="561">Tag Filter</text>
  <text class="t s" x="472" y="575">tag-only writes</text>

  <!-- Registers -->
  <rect class="blk" x="495" y="618" width="120" height="34" rx="4"/>
  <text class="t b" x="555" y="639">CSRs</text>

  <!-- Shared tag path: socket and RMW filter -->
  <path class="blk" d="M650,332 L668,346 V396 L650,410 Z"/>
  <rect class="blk" x="690" y="350" width="90" height="42" rx="4"/>
  <text class="t b" x="735" y="375">RMW Filter</text>

  <!-- Access checkers -->
  <rect class="grp" x="795" y="290" width="120" height="312" rx="5"/>
  <text class="t s" x="855" y="595">access checkers</text>

  <rect class="blk" x="805" y="298" width="100" height="34" rx="4"/>
  <text class="t b" x="855" y="313">Access Chk</text>
  <text class="t s" x="855" y="326">RevBM &#183; core TRVK</text>

  <rect class="blk" x="805" y="354" width="100" height="34" rx="4"/>
  <text class="t b" x="855" y="369">Access Chk</text>
  <text class="t s" x="855" y="382">Tags &#183; RMW</text>

  <rect class="blk" x="805" y="456" width="100" height="34" rx="4"/>
  <text class="t b" x="855" y="471">Access Chk</text>
  <text class="t s" x="855" y="484">RevBM &#183; TBRE TRVK</text>

  <rect class="blk" x="805" y="528" width="100" height="34" rx="4"/>
  <text class="t b" x="855" y="543">Access Chk</text>
  <text class="t s" x="855" y="556">RevBM &#183; window</text>

  <!-- Meta SRAM arbiter -->
  <path class="blk" d="M935,296 L955,316 V574 L935,594 Z"/>

  <!-- ================================================================ -->
  <!-- Crossbar and memories                                            -->
  <!-- ================================================================ -->
  <rect class="blk" x="20" y="760" width="780" height="44" rx="4"/>
  <text class="t b" x="410" y="787">Main TL-UL Crossbar</text>

  <rect class="mem" x="60" y="850" width="150" height="44" rx="4"/>
  <text class="t b" x="135" y="876">Main SRAM</text>
  <text class="t s" x="135" y="912">192 KiB</text>

  <rect class="mem" x="290" y="850" width="150" height="44" rx="4"/>
  <text class="t b" x="365" y="876">NVM</text>
  <text class="t s" x="365" y="912">2048 KiB</text>

  <rect class="mem" x="910" y="850" width="130" height="44" rx="4"/>
  <text class="t b" x="975" y="876">Meta SRAM</text>
  <text class="t s" x="975" y="912">38 KiB</text>

  <!-- ================================================================ -->
  <!-- Wires                                                            -->
  <!-- ================================================================ -->
  <!-- Instruction port, straight to the crossbar -->
  <path class="w" d="M64,94 V760"/>

  <!-- Core data port: Ibex -> TRVK -> tag filter -> WTRC -> crossbar -->
  <path class="wm" d="M210,94 V120"/>
  <path class="wm" d="M210,160 V305"/>
  <path class="w" d="M210,410 V760"/>

  <!-- Core TRVK filter bitmap lookups -->
  <path class="w" d="M265,140 H330 V245 H855 V298"/>

  <!-- Core tag filter meta port -->
  <path class="wm" d="M285,350 H650"/>
  <text class="sm" x="293" y="344">tag lookup / update</text>

  <!-- Write snoop into the TBRE -->
  <path class="wc" d="M285,415 H360"/>
  <text class="t s" x="322" y="409">snoop</text>

  <!-- TBRE internals -->
  <path class="wm" d="M545,434 V455"/>
  <path class="wm" d="M545,491 V512"/>
  <path class="wm" d="M400,434 V512"/>
  <text class="s" x="406" y="476">clear</text>
  <path class="wm" d="M472,528 V545"/>

  <!-- TBRE tag filter: meta port and read-only host port -->
  <path class="wm" d="M547,564 H630 V392 H650"/>
  <path class="w" d="M472,583 V760"/>

  <!-- TBRE TRVK filter bitmap lookups (hops over the TBRE meta wire) -->
  <path class="w" d="M600,473 H624 A6,6 0 0 1 636,473 H805"/>

  <!-- Registers -->
  <path class="w" d="M575,760 V652"/>
  <path class="wc" d="M555,618 V598"/>
  <text class="s" x="561" y="612">start</text>

  <!-- Shared tag path -->
  <path class="wm" d="M668,371 H690"/>
  <path class="w" d="M780,371 H805"/>

  <!-- Software view of the revocation bitmap -->
  <path class="w" d="M760,760 V545 H805"/>

  <!-- Mode enable -->
  <path class="wc" d="M895,270 V290"/>

  <!-- Access checkers into the arbiter, arbiter to the meta SRAM -->
  <path class="w" d="M905,315 H935"/>
  <path class="w" d="M905,371 H935"/>
  <path class="w" d="M905,473 H935"/>
  <path class="w" d="M905,545 H935"/>
  <path class="w" d="M955,445 H975 V850"/>

  <!-- Crossbar to the memories -->
  <path class="w" d="M135,804 V850"/>
  <path class="w" d="M365,804 V850"/>

  <!-- ================================================================ -->
  <!-- Ports                                                            -->
  <!-- ================================================================ -->
  <path class="port" d="M58,220 L64,214 L70,220 L64,226 Z"/>
  <path class="port" d="M204,220 L210,214 L216,220 L210,226 Z"/>
  <path class="port" d="M324,220 L330,214 L336,220 L330,226 Z"/>
  <text class="s" x="72" y="238">I</text>
  <text class="s" x="218" y="238">D</text>
  <text class="s" x="338" y="238">RevBM</text>

  <path class="port" d="M204,270 L210,264 L216,270 L210,276 Z"/>
  <path class="port" d="M849,270 L855,264 L861,270 L855,276 Z"/>
  <path class="port" d="M889,270 L895,264 L901,270 L895,276 Z"/>
  <text class="mono" x="220" y="262">cored_tl_d</text>
  <text class="mono" x="845" y="262" text-anchor="end">corerevbm_tl</text>
  <text class="mono" x="905" y="262">cheriot_ena_i</text>

  <path class="port" d="M204,710 L210,704 L216,710 L210,716 Z"/>
  <path class="port" d="M466,710 L472,704 L478,710 L472,716 Z"/>
  <path class="port" d="M569,710 L575,704 L581,710 L575,716 Z"/>
  <path class="port" d="M754,710 L760,704 L766,710 L760,716 Z"/>
  <path class="port" d="M969,710 L975,704 L981,710 L975,716 Z"/>
  <text class="mono" x="218" y="728">cored_tl_h</text>
  <text class="mono" x="480" y="728">tbre_tl_h</text>
  <text class="s" x="480" y="741">read-only</text>
  <text class="mono" x="583" y="728">regs_tl_d</text>
  <text class="mono" x="768" y="728">revbm_tl_d</text>
  <text class="mono" x="967" y="728" text-anchor="end">meta_sram_tl</text>

  <!-- ================================================================ -->
  <!-- Legend                                                           -->
  <!-- ================================================================ -->
  <rect x="480" y="840" width="400" height="74" rx="5" fill="#ffffff" stroke="#c8c8c8"/>
  <path class="w" d="M494,859 H530"/>
  <text class="s" x="540" y="862">TL-UL, request direction</text>
  <path class="wm" d="M494,877 H530"/>
  <text class="s" x="540" y="880">TL-UL with capability tag sideband</text>
  <path class="wc" d="M494,895 H530"/>
  <text class="s" x="540" y="898">snoop / control</text>
  <path class="port" d="M724,859 L730,853 L736,859 L730,865 Z"/>
  <text class="s" x="746" y="862">module port</text>
  <rect class="lock" x="722" y="871" width="16" height="12" rx="2"/>
  <text class="s" x="746" y="880">lockstep domain</text>
  <rect class="wtrc" x="722" y="889" width="16" height="12" rx="2"/>
  <text class="s" x="746" y="898">write-to-read-and-compare</text>
</svg>
