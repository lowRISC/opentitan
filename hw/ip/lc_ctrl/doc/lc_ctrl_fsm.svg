<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1010 800" width="1010" height="800">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e06666"/>
    </marker>
    <marker id="ahrr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff0000"/>
    </marker>
    <style>
      text { font-family: Arial, "Liberation Sans", Helvetica, sans-serif; font-size: 12px; fill: #000000; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
      .st { font-size: 14px; }
      .title { font-size: 22px; font-weight: bold; }
      .err { fill: #ff0000; }
      .leg { font-size: 15px; }
      .s { stroke: #000000; stroke-width: 1.5; }
      .startup { fill: #c9daf8; }
      .check { fill: #d9ead3; }
      .mux { fill: #d9d2e9; }
      .prog { fill: #fff2cc; }
      .term { fill: #f4cccc; }
      .w { stroke: #000000; stroke-width: 1.5; fill: none; }
      .r { stroke: #e06666; stroke-width: 1.5; fill: none; }
      .rr { stroke: #ff0000; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1010" height="800" fill="#ffffff"/>
  <text class="title c" x="430" y="36">LC CTRL FSM</text>

  <!-- ===================================================== error arcs (drawn first, behind states) -->
  <!-- CntIncrSt -> PostTransSt -->
  <path class="r" d="M694,150 C800,190 800,450 692,500" marker-end="url(#ahr)"/>
  <text class="err" x="778" y="300">trans_cnt_</text>
  <text class="err" x="778" y="314">oflw_error_o</text>
  <!-- CntProgSt -> PostTransSt -->
  <line class="r" x1="660" y1="364" x2="660" y2="476" marker-end="url(#ahr)"/>
  <text class="err" x="666" y="425">otp_prog_error_o</text>
  <!-- TransCheckSt -> PostTransSt -->
  <path class="r" d="M480,364 C480,420 600,420 640,481" marker-end="url(#ahr)"/>
  <text class="err e" x="472" y="384">trans_invalid_error_o</text>
  <!-- TokenHashSt -> PostTransSt -->
  <path class="r" d="M300,364 C300,440 560,430 633,486" marker-end="url(#ahr)"/>
  <text class="err e" x="292" y="384">token_invalid_error_o</text>
  <!-- TokenCheck0St / TokenCheck1St -> PostTransSt -->
  <path class="r" d="M140,483 C200,445 560,445 628,494" marker-end="url(#ahr)"/>
  <path class="r" d="M320,483 C360,460 560,460 628,494"/>
  <text class="err c" x="205" y="408">trans_invalid_error_o ||</text>
  <text class="err c" x="205" y="422">token_invalid_error_o ||</text>
  <text class="err c" x="205" y="436">nvm_rma_error_o</text>

  <!-- ===================================================== states -->
  <!-- row 1 -->
  <circle class="s startup" cx="120" cy="150" r="34"/>
  <text class="st c" x="120" y="146">Reset</text><text class="st c" x="120" y="163">St</text>
  <circle class="s startup" cx="300" cy="150" r="34"/>
  <text class="st c" x="300" y="146">Idle</text><text class="st c" x="300" y="163">St</text>
  <circle class="s mux" cx="480" cy="150" r="34"/>
  <text class="st c" x="480" y="146">Clk</text><text class="st c" x="480" y="163">MuxSt</text>
  <circle class="s check" cx="660" cy="150" r="34"/>
  <text class="st c" x="660" y="146">Cnt</text><text class="st c" x="660" y="163">IncrSt</text>

  <!-- row 2 -->
  <circle class="s mux" cx="120" cy="330" r="34"/>
  <text class="st c" x="120" y="318">Nvm</text><text class="st c" x="120" y="335">Rma</text><text class="st c" x="120" y="352">St</text>
  <circle class="s check" cx="300" cy="330" r="34"/>
  <text class="st c" x="300" y="318">Token</text><text class="st c" x="300" y="335">Hash</text><text class="st c" x="300" y="352">St</text>
  <circle class="s check" cx="480" cy="330" r="34"/>
  <text class="st c" x="480" y="318">Trans</text><text class="st c" x="480" y="335">Check</text><text class="st c" x="480" y="352">St</text>
  <circle class="s prog" cx="660" cy="330" r="34"/>
  <text class="st c" x="660" y="326">Cnt</text><text class="st c" x="660" y="343">ProgSt</text>

  <!-- row 3 -->
  <circle class="s check" cx="120" cy="510" r="34"/>
  <text class="st c" x="120" y="498">Token</text><text class="st c" x="120" y="515">Check</text><text class="st c" x="120" y="532">0St</text>
  <circle class="s check" cx="300" cy="510" r="34"/>
  <text class="st c" x="300" y="498">Token</text><text class="st c" x="300" y="515">Check</text><text class="st c" x="300" y="532">1St</text>
  <circle class="s prog" cx="480" cy="510" r="34"/>
  <text class="st c" x="480" y="506">Trans</text><text class="st c" x="480" y="523">ProgSt</text>
  <circle class="s term" cx="660" cy="510" r="34"/>
  <text class="st c" x="660" y="506">PostTr</text><text class="st c" x="660" y="523">ansSt</text>

  <!-- row 4 -->
  <circle class="s term" cx="120" cy="700" r="34"/>
  <text class="st c" x="120" y="696">Scrap</text><text class="st c" x="120" y="713">St</text>
  <circle class="s term" cx="300" cy="700" r="34"/>
  <text class="st c" x="300" y="696">Escala</text><text class="st c" x="300" y="713">teSt</text>
  <circle class="s term" cx="480" cy="700" r="34"/>
  <text class="st c" x="480" y="696">Invalid</text><text class="st c" x="480" y="713">St</text>

  <!-- ===================================================== normal transitions -->
  <path class="w" d="M45,95 C75,95 100,105 108,118" marker-end="url(#ah)"/>
  <circle cx="45" cy="95" r="4" fill="#000000"/>

  <line class="w" x1="154" y1="150" x2="266" y2="150" marker-end="url(#ah)"/>
  <text class="c" x="210" y="125">init_req_i &amp;&amp;</text>
  <text class="c" x="210" y="140">lc_state_valid_q</text>

  <line class="w" x1="334" y1="150" x2="446" y2="150" marker-end="url(#ah)"/>
  <text class="c" x="390" y="140">trans_cmd_i</text>

  <line class="w" x1="514" y1="150" x2="626" y2="150" marker-end="url(#ah)"/>
  <text class="c" x="570" y="58">In RAW, TEST_* and RMA</text>
  <text class="c" x="570" y="72">with use_ext_clock_i set,</text>
  <text class="c" x="570" y="86">steer the clock mux and</text>
  <text class="c" x="570" y="100">wait until</text>
  <text class="c" x="570" y="114">lc_clk_byp_ack_i == On</text>

  <line class="w" x1="660" y1="184" x2="660" y2="296" marker-end="url(#ah)"/>

  <line class="w" x1="626" y1="330" x2="514" y2="330" marker-end="url(#ah)"/>
  <text class="c" x="570" y="320">otp_prog_ack_i</text>

  <line class="w" x1="446" y1="330" x2="334" y2="330" marker-end="url(#ah)"/>

  <line class="w" x1="266" y1="330" x2="154" y2="330" marker-end="url(#ah)"/>
  <text class="c" x="210" y="292">token_hash_ack_i</text>
  <text class="c" x="210" y="307">&amp;&amp; first token</text>
  <text class="c" x="210" y="322">check OK</text>

  <line class="w" x1="120" y1="364" x2="120" y2="476" marker-end="url(#ah)"/>
  <text class="e" x="110" y="400">If target is RMA,</text>
  <text class="e" x="110" y="415">wait until</text>
  <text class="e" x="110" y="430">lc_nvm_rma_ack_i</text>
  <text class="e" x="110" y="445">== On</text>

  <line class="w" x1="154" y1="510" x2="266" y2="510" marker-end="url(#ah)"/>
  <text class="c" x="210" y="545">2nd token</text>
  <text class="c" x="210" y="560">check OK</text>

  <line class="w" x1="334" y1="510" x2="446" y2="510" marker-end="url(#ah)"/>
  <text class="c" x="390" y="545">3rd token</text>
  <text class="c" x="390" y="560">check OK</text>

  <line class="w" x1="514" y1="510" x2="626" y2="510" marker-end="url(#ah)"/>
  <text class="c" x="585" y="545">otp_prog_ack_i</text>
  <text class="err c" x="585" y="560">(otp_prog_error_o ||</text>
  <text class="err c" x="585" y="574">nvm_rma_error_o)</text>

  <!-- self loops -->
  <g class="w">
    <path d="M142,176 C175,215 135,235 122,186" marker-end="url(#ah)"/>
    <path d="M322,176 C355,215 315,235 302,186" marker-end="url(#ah)"/>
    <path d="M502,176 C535,215 495,235 482,186" marker-end="url(#ah)"/>
    <path d="M686,308 C730,280 735,345 694,338" marker-end="url(#ah)"/>
    <path d="M98,304 C70,255 115,250 112,297" marker-end="url(#ah)"/>
    <path d="M322,304 C350,255 305,250 308,297" marker-end="url(#ah)"/>
    <path d="M502,536 C535,575 495,595 482,546" marker-end="url(#ah)"/>
    <path d="M682,536 C715,575 675,595 662,546" marker-end="url(#ah)"/>
    <path d="M142,726 C175,765 135,785 122,736" marker-end="url(#ah)"/>
    <path d="M322,726 C355,765 315,785 302,736" marker-end="url(#ah)"/>
    <path d="M502,726 C535,765 495,785 482,736" marker-end="url(#ah)"/>
  </g>

  <!-- terminal state entries -->
  <line class="rr" x1="70" y1="650" x2="96" y2="676" marker-end="url(#ahrr)"/>
  <text class="err c" x="140" y="618">From IdleSt if the</text>
  <text class="err c" x="140" y="633">life cycle state is</text>
  <text class="err c" x="140" y="648">SCRAP</text>
  <line class="rr" x1="250" y1="650" x2="276" y2="676" marker-end="url(#ahrr)"/>
  <text class="err c" x="310" y="603">From any state if</text>
  <text class="err c" x="310" y="618">esc_scrap_state0 or</text>
  <text class="err c" x="310" y="633">esc_scrap_state1 is</text>
  <text class="err c" x="310" y="648">asserted</text>
  <line class="rr" x1="430" y1="650" x2="456" y2="676" marker-end="url(#ahrr)"/>
  <text class="err c" x="500" y="618">From any state other than</text>
  <text class="err c" x="500" y="633">EscalateSt on an invalid</text>
  <text class="err c" x="500" y="648">state or KMAC IF FSM error</text>

  <!-- ===================================================== legend -->
  <rect x="860" y="130" width="130" height="44" class="startup"/>
  <text class="leg c" x="925" y="149">Startup /</text><text class="leg c" x="925" y="166">Broadcast</text>
  <rect x="860" y="190" width="130" height="44" class="check"/>
  <text class="leg c" x="925" y="217">Check States</text>
  <rect x="860" y="250" width="130" height="44" class="mux"/>
  <text class="leg c" x="925" y="269">Mux / RMA</text><text class="leg c" x="925" y="286">Req States</text>
  <rect x="860" y="310" width="130" height="44" class="prog"/>
  <text class="leg c" x="925" y="329">Program</text><text class="leg c" x="925" y="346">States</text>
  <rect x="860" y="370" width="130" height="44" class="term"/>
  <text class="leg c" x="925" y="397">Terminal States</text>

  <!-- volatile RAW unlock note -->
  <text x="700" y="640">If SecVolatileRawUnlockEn = 1, IdleSt</text>
  <text x="700" y="655">also handles a volatile RAW unlock.</text>
  <text x="700" y="670">On success it stays in IdleSt and</text>
  <text x="700" y="685">updates the volatile life cycle state.</text>
  <text x="700" y="700">On failure it moves to PostTransSt.</text>
</svg>
