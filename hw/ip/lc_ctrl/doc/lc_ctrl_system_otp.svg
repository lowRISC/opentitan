<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1210 930" width="1210" height="930">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0000ff"/>
    </marker>
    <style>
      text { font-family: "Inconsolata", "DejaVu Sans Mono", "Courier New", monospace; font-size: 11px; fill: #000000; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
      .ip { font-size: 12.5px; font-weight: bold; }
      .lc { fill: #0000ff; }
      .sm { font-size: 10.5px; }
      .note { fill: #666666; font-size: 10.5px; }
      .red { fill: #ff0000; font-weight: bold; }
      .bold { font-weight: bold; }
      .blk { fill: #cfe2f3; stroke: #595959; stroke-width: 1; }
      .sub { fill: #ffffff; stroke: #000000; stroke-width: 1; }
      .csr { fill: #cccccc; stroke: #000000; stroke-width: 1; }
      .gate { fill: #f4cccc; stroke: #ff0000; stroke-width: 1; }
      .w { stroke: #000000; stroke-width: 1; fill: none; }
      .wb { stroke: #0000ff; stroke-width: 1; fill: none; }
      .bus { fill: #ffffff; stroke: #000000; stroke-width: 1; }
    </style>
  </defs>

