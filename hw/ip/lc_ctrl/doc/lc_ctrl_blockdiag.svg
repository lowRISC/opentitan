<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1320 940" width="1320" height="940">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#000000"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0000ff"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38761d"/>
    </marker>
    <style>
      text { font-family: "Inconsolata", "DejaVu Sans Mono", "Courier New", monospace; font-size: 11px; fill: #000000; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
      .ip { font-size: 12.5px; font-weight: bold; }
      .bold { font-weight: bold; }
      .lc { fill: #0000ff; }
      .grn { fill: #38761d; }
      .top { fill: #f3f3f3; stroke: #000000; stroke-width: 1; }
      .fsmblk { fill: #ffffff; stroke: #000000; stroke-width: 1; }
      .sub { fill: #ffffff; stroke: #000000; stroke-width: 1; }
      .csr { fill: #b7b7b7; stroke: #000000; stroke-width: 1; }
      .comb { fill: #cfe2f3; stroke: #000000; stroke-width: 1; }
      .w { stroke: #000000; stroke-width: 1; fill: none; }
      .wt { stroke: #000000; stroke-width: 2.5; fill: none; }
      .wb { stroke: #0000ff; stroke-width: 1; fill: none; }
      .wg { stroke: #38761d; stroke-width: 2.5; fill: none; }
      .bus { fill: #ffffff; stroke: #000000; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1320" height="940" fill="#ffffff"/>

  <!-- ===================================================== lc_ctrl -->
  <rect class="top" x="240" y="40" width="965" height="705"/>
  <text class="ip" x="250" y="736">lc_ctrl</text>
  <rect class="fsmblk" x="560" y="335" width="635" height="390"/>

  <!-- inputs/outputs at the top -->
