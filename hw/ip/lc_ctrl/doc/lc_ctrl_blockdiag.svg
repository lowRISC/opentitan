  <text class="c" x="1050" y="495">encode next state</text>
  <rect class="comb" x="940" y="520" width="220" height="50"/>
  <text class="c bold" x="1050" y="538">lc_ctrl_signal_decode</text>
  <text class="c" x="1050" y="552">Decode control signals</text>
  <text class="c" x="1050" y="565">based on state</text>

