  <line class="wg" x1="885" y1="457" x2="915" y2="457"/>
  <line class="w" x1="915" y1="405" x2="940" y2="405" style="stroke:#38761d" marker-end="url(#ahg)"/>
  <line class="w" x1="915" y1="475" x2="940" y2="475" style="stroke:#38761d" marker-end="url(#ahg)"/>
  <line class="w" x1="915" y1="545" x2="940" y2="545" style="stroke:#38761d" marker-end="url(#ahg)"/>
