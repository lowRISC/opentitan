  <line class="w" x1="565" y1="18" x2="565" y2="55" marker-end="url(#ah)"/>
  <line class="w" x1="615" y1="18" x2="615" y2="55" marker-end="url(#ah)"/>
  <text class="c" x="790" y="13">lc_nvm_rma_seed_o</text>
  <line class="w" x1="790" y1="55" x2="790" y2="18" marker-end="url(#ah)"/>

  <!-- HW revision -->
  <rect class="sub" x="300" y="48" width="140" height="30"/>
