  <line class="w" x1="300" y1="63" x2="235" y2="63" marker-end="url(#ah)"/>
  <text class="e" x="230" y="67">hw_rev_o</text>
  <line class="w" x1="440" y1="63" x2="520" y2="63" marker-end="url(#ah)"/>

  <!-- SW register file -->
