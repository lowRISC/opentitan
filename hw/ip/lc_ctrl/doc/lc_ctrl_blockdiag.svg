  <text class="c" x="755" y="134">Transition</text>
  <text class="c" x="755" y="148">Interface</text>
  <text class="c" x="755" y="168">(claim, token,</text>
  <text class="c" x="755" y="182">target, cmd)</text>
  <line class="w" x1="650" y1="90" x2="680" y2="90" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <line class="w" x1="650" y1="195" x2="680" y2="195" marker-start="url(#ah)" marker-end="url(#ah)"/>

